name: Portable dictionary verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["windows-latest"]'
      craft-fonts-ref: ''
      tools: ''
      targets: ''
      command: |
        git switch --detach 2bf1b9275b330202ee10e6bcaea78c56847567dd
        cargo fmt -p craft-proof --check
        cargo clippy -p craft-proof --all-targets --locked -- -D warnings
        cargo test -p craft-proof --lib portable_dictionary_is_found_beside_the_executable --locked
        git init language-data
        git -C language-data fetch --depth 1 https://github.com/storytold/craft-i18n.git c239f934ace90b7939afaceb23b472ceeafd6b8a
        git -C language-data checkout --detach FETCH_HEAD
        export CRAFT_I18N_DIR="$PWD/language-data"
        export CRAFT_I18N_REQUIRED=1
        cargo test -p craft-proof --lib portable_dictionary_is_found_beside_the_executable --locked
